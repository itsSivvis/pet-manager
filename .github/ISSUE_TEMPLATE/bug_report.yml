name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security vulnerabilities here – see SECURITY.md.
        Never include passwords, tokens or personal data (also not in screenshots or logs).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under Settings → About, or the Docker image tag.
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker Compose, Manual (Node.js), Other]
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Firefox 140 on Android, installed as PWA
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
