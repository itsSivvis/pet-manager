name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petmanager
          POSTGRES_PASSWORD: petmanager
          POSTGRES_DB: petmanager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petmanager" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://petmanager:petmanager@localhost:5432/petmanager_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: Translation check, unit & integration tests
        run: npm test
      - name: Dependency licenses
        run: npm run licenses
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Build client
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 3

  e2e:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petmanager
          POSTGRES_PASSWORD: petmanager
          POSTGRES_DB: petmanager_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petmanager" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://petmanager:petmanager@localhost:5432/petmanager_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pet-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
