# Production setup: app + PostgreSQL.
#   cp .env.example .env   # then set at least JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d
# The app listens on 127.0.0.1:3000 only – put a reverse proxy with HTTPS in
# front of it (see README).
name: pet-manager

services:
  app:
    image: ${PET_MANAGER_IMAGE:-ghcr.io/owner/pet-manager:latest}
    # Build locally instead of pulling: docker compose up -d --build
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-petmanager}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-petmanager}
      UPLOAD_DIR: /data/uploads
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-petmanager}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
  uploads:
